services:
  db:
    image: postgres:17-alpine
    container_name: alya-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    
    volumes:
      - alya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    
volumes:
  alya_postgres_data: